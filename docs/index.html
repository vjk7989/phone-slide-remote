<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Slide remote</title>
<style>
  :root { font: 18px system-ui, sans-serif; color: #f9fafb; background: #111827; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.2rem; }
  main { width: min(100%, 28rem); }
  h1 { margin: 0 0 .3rem; font-size: 1.5rem; }
  p { margin: .3rem 0 1.3rem; color: #b6c2d3; font-size: .87rem; }
  #status { display: flex; align-items: center; gap: .5rem; min-height: 2rem; margin-bottom: 1rem; font-size: .85rem; color: #fbbf24; }
  #status::before { content: ""; width: .6rem; height: .6rem; border-radius: 50%; background: currentColor; }
  #status.online { color: #86efac; }
  .slides { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  .switches { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-top: 1rem; }
  button { border: 0; border-radius: 1rem; color: #fff; font: inherit; font-weight: 700; touch-action: manipulation; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button:active:not(:disabled) { transform: scale(.98); }
  .slides button { min-height: 10rem; font-size: 1.4rem; background: #2563eb; }
  .slides button:first-child { background: #374151; }
  .switches button { min-height: 5.5rem; padding: .4rem; background: #374151; font-size: .9rem; }
  #acknowledge { display: none; width: 100%; margin-top: 1rem; min-height: 3.5rem; background: #b45309; font-size: .9rem; }
  #acknowledge.visible { display: block; }
  small { display: block; margin-top: 1.2rem; color: #9ca3af; line-height: 1.4; }
</style>
<main>
  <h1>Slide remote</h1>
  <p>Keep the PDF focused on your laptop.</p>
  <div id="status" role="status" aria-live="polite">Connecting…</div>
  <div class="slides">
    <button type="button" data-action="previous">← Previous</button>
    <button type="button" data-action="next">Next →</button>
  </div>
  <div class="switches">
    <button type="button" data-action="window">Switch window<br><span aria-hidden="true">Alt+Tab</span></button>
    <button type="button" data-action="tab">Next browser tab<br><span aria-hidden="true">Ctrl+Tab</span></button>
  </div>
  <button id="acknowledge" type="button">I checked the laptop screen</button>
  <small>If a press reports a connection error, check the laptop screen before pressing again.</small>
</main>
<script>
(() => {
  const fragment = location.hash.slice(1);
  const pairing = new URLSearchParams(fragment);
  const hosted = pairing.has("endpoint");
  let token = hosted ? (pairing.get("token") || "") : fragment;
  let apiBase = location.origin;
  if (hosted) {
    try {
      const endpoint = new URL(pairing.get("endpoint"));
      if (endpoint.protocol !== "https:" || !/^[a-z0-9-]+\.trycloudflare\.com$/.test(endpoint.hostname)) throw new Error("invalid endpoint");
      apiBase = endpoint.origin;
    } catch { token = ""; }
  }
  const buttons = [...document.querySelectorAll("button[data-action]")];
  const status = document.getElementById("status");
  const acknowledge = document.getElementById("acknowledge");
  let online = false;
  let busy = false;
  let uncertain = false;
  const setStatus = (message, connected) => {
    online = connected;
    status.textContent = message;
    status.classList.toggle("online", connected);
    buttons.forEach(button => button.disabled = !connected || busy || uncertain);
  };
  async function check() {
    if (!token) { setStatus("Start the laptop helper, then scan its private QR code", false); return; }
    try {
      const response = await fetch(apiBase + "/health", {headers: {"X-Remote-Token": token}, cache: "no-store", signal: AbortSignal.timeout(4000)});
      if (!uncertain) setStatus(response.ok ? "Connected" : "Private link expired; scan the new QR code", response.ok);
    } catch { if (!uncertain) setStatus("Disconnected; check internet or Bluetooth", false); }
  }
  acknowledge.addEventListener("click", () => {
    uncertain = false;
    acknowledge.classList.remove("visible");
    check();
  });
  buttons.forEach(button => button.addEventListener("click", async () => {
    if (busy || !online) return;
    busy = true;
    buttons.forEach(item => item.disabled = true);
    try {
      const id = Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
      const response = await fetch(apiBase + "/command", {
        method: "POST", headers: {"Content-Type": "application/json", "X-Remote-Token": token},
        body: JSON.stringify({action: button.dataset.action, id}), signal: AbortSignal.timeout(5000)
      });
      if (!response.ok) throw new Error((await response.json()).error || "Command failed");
      setStatus("Sent: " + button.textContent.trim().replace(/\s+/g, " "), true);
    } catch (error) {
      uncertain = true;
      acknowledge.classList.add("visible");
      setStatus("Uncertain: check laptop before trying again (" + error.message + ")", false);
    }
    finally { busy = false; buttons.forEach(item => item.disabled = !online || uncertain); }
  }));
  check();
  setInterval(() => { if (!busy) check(); }, 4000);
})();
</script>
</html>
